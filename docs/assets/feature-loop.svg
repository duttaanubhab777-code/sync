<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="Sync — connected, always in motion">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071b16"/><stop offset=".52" stop-color="#0b1824"/><stop offset="1" stop-color="#17132d"/></linearGradient><linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22c55e"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><radialGradient id="glow"><stop stop-color="#22c55e" stop-opacity=".28"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/></radialGradient><filter id="soft"><feGaussianBlur stdDeviation="16"/></filter></defs>
<rect width="1000" height="250" rx="24" fill="url(#bg)"/><circle cx="170" cy="120" r="115" fill="url(#glow)" filter="url(#soft)"><animate attributeName="cx" values="170;250;170" dur="9s" repeatCount="indefinite"/></circle><circle cx="850" cy="130" r="130" fill="#7c3aed" opacity=".12" filter="url(#soft)"><animate attributeName="cy" values="130;90;130" dur="7s" repeatCount="indefinite"/></circle>
<g fill="none" stroke="url(#stroke)" stroke-width="1.6" opacity=".42"><path d="M80 170 C220 35 340 220 500 115 S780 35 930 150" stroke-dasharray="7 11"><animate attributeName="stroke-dashoffset" from="0" to="-180" dur="8s" repeatCount="indefinite"/></path><path d="M70 190 C260 65 370 220 530 130 S790 65 930 175" stroke-dasharray="2 10"><animate attributeName="stroke-dashoffset" from="0" to="120" dur="10s" repeatCount="indefinite"/></path></g>
<g fill="#4ade80"><circle cx="140" cy="132" r="4"><animate attributeName="r" values="3;7;3" dur="2s" repeatCount="indefinite"/></circle><circle cx="500" cy="115" r="5"><animate attributeName="r" values="4;9;4" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="850" cy="130" r="4"><animate attributeName="r" values="3;7;3" dur="1.8s" repeatCount="indefinite"/></circle></g>
<g transform="translate(500 115)" fill="none" stroke="url(#stroke)"><circle r="56" stroke-width="1.4" opacity=".4"><animate attributeName="r" values="48;72;48" dur="4.5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".5;0;.5" dur="4.5s" repeatCount="indefinite"/></circle><circle r="38" stroke-width="1.5" stroke-dasharray="6 7"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/></circle><circle r="24" stroke-width="2.5" stroke-dasharray="48 110" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="7s" repeatCount="indefinite"/></circle></g>
<g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle"><text x="500" y="108" font-size="25" font-weight="750" fill="#f8fafc" letter-spacing="5">SYNC</text><text x="500" y="137" font-size="11" fill="#a7f3d0" letter-spacing="3">EVERY MOMENT, CONNECTED</text><text x="500" y="218" font-size="12" fill="#cbd5e1" letter-spacing="2">CHAT · CREATE · SHARE · STAY IN SYNC</text></g>
<g fill="none" stroke="#86efac" stroke-width="1.2" opacity=".65"><circle cx="105" cy="65" r="10"><animate attributeName="r" values="7;13;7" dur="3s" repeatCount="indefinite"/></circle><circle cx="900" cy="65" r="7"><animate attributeName="r" values="5;10;5" dur="2.6s" repeatCount="indefinite"/></circle><path d="M875 190 l8 -8 8 8 -8 8z"><animateTransform attributeName="transform" type="rotate" from="0 883 190" to="360 883 190" dur="12s" repeatCount="indefinite"/></path></g></svg>