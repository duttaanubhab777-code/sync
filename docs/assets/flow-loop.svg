<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" width="1000" height="190" role="img" aria-label="Sync background upload pipeline">
<defs><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1c18"/><stop offset="1" stop-color="#101a2b"/></linearGradient><linearGradient id="pipe" x1="0" x2="1"><stop stop-color="#4ade80"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs><rect width="1000" height="190" rx="20" fill="url(#panel)" stroke="#24453c"/><text x="38" y="38" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">RESILIENT MEDIA PIPELINE</text>
<g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle"><g fill="#0f2c24" stroke="#2d8b61"><rect x="38" y="70" width="170" height="74" rx="13"/><rect x="292" y="70" width="170" height="74" rx="13"/><rect x="546" y="70" width="170" height="74" rx="13"/><rect x="800" y="70" width="160" height="74" rx="13"/></g><g fill="#dcfce7" font-size="13" font-weight="650"><text x="123" y="101">Pick &amp; prepare</text><text x="123" y="121" fill="#86efac" font-size="10">Compress when useful</text><text x="377" y="101">Persistent outbox</text><text x="377" y="121" fill="#86efac" font-size="10">IndexedDB + retry</text><text x="631" y="101">Chunked transfer</text><text x="631" y="121" fill="#86efac" font-size="10">Resume after network loss</text><text x="880" y="101">Cloudinary</text><text x="880" y="121" fill="#86efac" font-size="10">Direct media storage</text></g><g stroke="url(#pipe)" stroke-width="3" fill="none" stroke-linecap="round"><path d="M208 107 H292 M462 107 H546 M716 107 H800" stroke-dasharray="8 8"><animate attributeName="stroke-dashoffset" from="0" to="-64" dur="2s" repeatCount="indefinite"/></path></g><g fill="#67e8f9"><circle r="4"><animateMotion dur="2.2s" repeatCount="indefinite" path="M208 107 H292 M462 107 H546 M716 107 H800"/></circle><circle r="3"><animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite" path="M208 107 H292 M462 107 H546 M716 107 H800"/></circle></g></g><text x="500" y="171" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" text-anchor="middle" letter-spacing="1.4">PAGE CHANGES, RELOADS AND TEMPORARY OFFLINE PERIODS DO NOT IMMEDIATELY CANCEL THE QUEUE</text></svg>