<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#031512" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Sync — fast, secure messaging for chats, groups and stories." />
    <meta name="application-name" content="Sync" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sync" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="preload" as="image" type="image/webp" href="/logo-mark.webp" fetchpriority="high" />
    <title>Sync</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* অ্যাপ খুললে (PWA ও Android APK দুটোতেই) লোগো + অ্যানিমেশন splash।
         শুধু transform/opacity অ্যানিমেট হয়, তাই lag হয় না। */
      html, body { margin: 0; background: #031512; }
      #boot {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background:
          radial-gradient(60% 45% at 50% 40%, rgba(0, 237, 100, 0.18), transparent 70%),
          #031512;
        transition: opacity 0.45s ease;
        overflow: hidden;
      }
      #boot.is-gone { opacity: 0; pointer-events: none; }
      .boot-stage { position: relative; width: 168px; height: 168px; display: grid; place-items: center; }
      .boot-glow {
        position: absolute; inset: -30px; border-radius: 50%;
        background: radial-gradient(closest-side, rgba(0, 237, 100, 0.35), transparent 72%);
        animation: boot-pulse 1.8s ease-in-out infinite;
      }
      .boot-ring {
        position: absolute; inset: 0; border-radius: 50%;
        border: 3px solid rgba(130, 255, 190, 0.12);
        border-top-color: #00ed64; border-right-color: #2ccb9a;
        animation: boot-orbit 1.1s linear infinite;
      }
      .boot-ring.is-slow {
        inset: 14px; border-width: 2px;
        border-top-color: transparent; border-right-color: transparent;
        border-bottom-color: #b6f34d; border-left-color: #1fa7b0;
        animation-duration: 1.9s; animation-direction: reverse;
      }
      #boot img {
        position: relative; width: 96px; height: 96px; display: block;
        animation: boot-pop 0.7s cubic-bezier(0.2, 0.9, 0.3, 1.25) both;
      }
      #boot b {
        margin-top: 26px;
        font: 800 1.9rem/1 "Plus Jakarta Sans", system-ui, sans-serif; letter-spacing: -0.03em;
        background: linear-gradient(100deg, #b6f34d, #00ed64 40%, #2ccb9a 75%, #1fa7b0);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        animation: boot-rise 0.6s 0.35s ease-out both;
      }
      #boot p {
        margin: 10px 0 0; color: #9bb8ad;
        font: 500 0.9rem/1.2 "Plus Jakarta Sans", system-ui, sans-serif;
        animation: boot-rise 0.6s 0.6s ease-out both;
      }
      .boot-bar {
        position: absolute; left: 50%; bottom: calc(56px + env(safe-area-inset-bottom, 0px));
        width: 120px; height: 3px; margin-left: -60px; border-radius: 3px;
        background: rgba(130, 255, 190, 0.12); overflow: hidden;
      }
      .boot-bar i {
        display: block; width: 100%; height: 100%; border-radius: 3px;
        background: linear-gradient(90deg, #b6f34d, #00ed64, #1fa7b0);
        transform-origin: left center; transform: scaleX(0);
        animation: boot-fill 2.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      @keyframes boot-orbit { to { transform: rotate(360deg); } }
      @keyframes boot-pulse { 0%, 100% { opacity: 0.55; transform: scale(0.92); } 50% { opacity: 1; transform: scale(1.06); } }
      @keyframes boot-pop { from { opacity: 0; transform: scale(0.4) rotate(-90deg); } to { opacity: 1; transform: scale(1) rotate(0); } }
      @keyframes boot-rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes boot-fill { to { transform: scaleX(1); } }
      @media (prefers-reduced-motion: reduce) {
        #boot img, #boot b, #boot p { animation: none; }
        .boot-glow, .boot-ring { animation: none; }
        .boot-bar i { animation-duration: 0.01s; }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div class="boot-stage">
        <span class="boot-glow"></span>
        <span class="boot-ring"></span>
        <span class="boot-ring is-slow"></span>
        <img src="/logo-mark.webp" width="96" height="96" alt="" />
      </div>
      <b>Sync</b>
      <p>Stay close. Stay in sync.</p>
      <div class="boot-bar"><i></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
