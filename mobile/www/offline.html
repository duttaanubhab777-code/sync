<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#031512">
<title>Sync</title>
<style>
:root{
  --bg:#031512;--bg2:#0b2b24;--panel:rgba(5,24,20,.82);--line:rgba(130,255,190,.16);
  --text:#e8f7f0;--text2:#9bb8ad;--mongo:#00ed64;--warn:#ffc24b;--bad:#ff6b6b;
  --grad:linear-gradient(135deg,#00ed64 0%,#4ee58a 48%,#2fd3a8 100%);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Roboto Mono",monospace;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));
  background:radial-gradient(120% 80% at 50% 0%,#0b2b24 0%,var(--bg) 60%);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Hind Siliguri",sans-serif;text-align:center;
  -webkit-tap-highlight-color:transparent;overflow-x:hidden
}
.card{width:min(400px,100%);animation:rise .5s cubic-bezier(.22,.9,.28,1) both}
[hidden]{display:none!important}

/* ring */
.ring{position:relative;width:92px;height:92px;margin:0 auto 24px;display:grid;place-items:center}
.ring::before,.ring::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--mongo);animation:ping 2s ease-out infinite}
.ring::after{animation-delay:1s}
.ring span{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--bg2);border:1px solid var(--line)}
.ring svg{width:30px;height:30px;stroke:var(--mongo);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ring.warn::before,.ring.warn::after{border-color:var(--warn)}
.ring.warn svg{stroke:var(--warn)}
.ring.small{width:64px;height:64px;margin-bottom:16px}
.ring.small span{width:44px;height:44px}
.ring.small svg{width:22px;height:22px}

h1{font-size:1.35rem;font-weight:800;letter-spacing:-.02em;margin-bottom:8px}
.lead{font-size:.92rem;line-height:1.5;color:var(--text2);margin-bottom:18px}

/* status chips */
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;font-size:.74rem;font-weight:600;font-style:normal;
  color:var(--text2);background:rgba(255,255,255,.04);border:1px solid var(--line);transition:color .3s,border-color .3s}
.chip em{font-style:normal}
.chip i{width:8px;height:8px;border-radius:50%;background:#5b7a6f;transition:background .3s,box-shadow .3s}
.chip.ok{color:var(--text)}.chip.ok i{background:var(--mongo);box-shadow:0 0 8px var(--mongo)}
.chip.wait{color:var(--text)}.chip.wait i{background:var(--warn);animation:blink 1.1s ease-in-out infinite}
.chip.bad{color:var(--text)}.chip.bad i{background:var(--bad)}

/* boot log */
.term{text-align:left;border-radius:18px;background:var(--panel);border:1px solid var(--line);overflow:hidden;
  box-shadow:0 24px 50px -28px rgba(0,237,100,.45)}
.term-bar{display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.03)}
.term-bar b{width:9px;height:9px;border-radius:50%;background:#1d4a3c}
.term-bar b:first-child{background:#00ed64}
.term-title{margin-left:6px;font:600 .72rem var(--mono);color:var(--text2);letter-spacing:.02em}
.term-time{margin-left:auto;font:600 .72rem var(--mono);color:var(--mongo)}
.log{height:218px;overflow-y:auto;padding:12px 14px;font:.74rem/1.7 var(--mono);color:var(--text2);scroll-behavior:smooth;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 14px);mask-image:linear-gradient(to bottom,transparent 0,#000 14px)}
.log::-webkit-scrollbar{display:none}
.row{display:flex;gap:9px;align-items:baseline;animation:line .35s ease both}
.row .t{color:#4f7567;flex:none}
.row .m{flex:1;min-width:0;word-break:break-word}
.row .s{flex:none;width:14px;text-align:center;color:var(--mongo);font-weight:700}
.row.done .m{color:var(--text)}
.row .s .sp{display:inline-block;width:9px;height:9px;border-radius:50%;border:2px solid rgba(0,237,100,.25);border-top-color:var(--mongo);animation:spin .8s linear infinite}
.bar{height:4px;background:rgba(255,255,255,.06)}
.bar i{display:block;height:100%;width:0;background:var(--grad);border-radius:0 4px 4px 0;transition:width .6s ease;box-shadow:0 0 12px rgba(0,237,100,.6)}
.note{margin-top:14px;font-size:.8rem;line-height:1.5;color:var(--text2);min-height:2.4em}

/* buttons */
button{width:100%;border:0;border-radius:16px;padding:14px 18px;font:inherit;font-weight:800;font-size:1rem;color:#022b17;background:var(--grad);
  cursor:pointer;box-shadow:0 14px 30px -12px rgba(0,237,100,.6);transition:transform .18s,opacity .2s}
button:active{transform:scale(.97)}
button[disabled]{opacity:.65}
.ghost{margin-top:4px;width:auto;padding:9px 18px;font-size:.82rem;font-weight:700;color:var(--text);background:rgba(255,255,255,.05);
  border:1px solid var(--line);box-shadow:none;border-radius:999px}
small{display:block;margin-top:14px;font-size:.8rem;color:var(--text2);min-height:1.2em}

@keyframes ping{0%{transform:scale(.7);opacity:.6}100%{transform:scale(1.5);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes line{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.ring::before,.ring::after,.card,.row,.chip.wait i,.row .s .sp{animation:none}}
</style>
</head>
<body>
<main class="card">

  <!-- No internet -->
  <section id="offlineView" hidden>
    <div class="ring warn"><span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5.5 12.4a10 10 0 0 1 13 0"/><path d="M9 16a5 5 0 0 1 6 0"/><path d="M12 19.5h.01"/><path d="M3 3l18 18"/></svg>
    </span></div>
    <h1>No internet connection</h1>
    <p class="lead">Turn on mobile data or Wi-Fi. Sync reconnects by itself as soon as you are back online.</p>
    <button id="retry" type="button">Try again</button>
    <small id="offMsg" role="status"></small>
  </section>

  <!-- Internet OK, server starting -->
  <section id="bootView">
    <div class="ring small"><span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01"/></svg>
    </span></div>
    <h1 id="bootTitle">Connecting to Sync</h1>
    <p class="lead" id="bootLead">Checking the server...</p>

    <div class="chips" aria-live="polite">
      <span class="chip" id="chipNet"><i></i><em>Internet</em></span>
      <span class="chip" id="chipSrv"><i></i><em>Server</em></span>
      <span class="chip" id="chipPing" hidden><i></i><em id="pingTxt">Ping</em></span>
    </div>

    <div class="term">
      <div class="term-bar"><b></b><b></b><b></b><span class="term-title">sync / server boot</span><span class="term-time" id="elapsed">00:00</span></div>
      <div class="log" id="log" role="log" aria-live="off"></div>
      <div class="bar"><i id="barFill"></i></div>
    </div>
    <p class="note" id="note"></p>
    <button id="now" class="ghost" type="button">Check now</button>
  </section>

</main>
<script>
(function () {
  "use strict";

  var SERVER = "https://sync-5lfm.onrender.com";
  // Real internet check (the same kind of URL Android itself uses). no-cors is fine here:
  // we only need to know whether the request got through, not read the body.
  var NET_PROBES = [
    "https://connectivitycheck.gstatic.com/generate_204",
    "https://www.cloudflare.com/cdn-cgi/trace"
  ];

  // Startup steps with the second each one appears. Render does not give clients its real
  // boot log, so these are timed; the final "ready" is decided only by a real /health response.
  var STEPS = [
    [0,  "Reaching the Sync server"],
    [2,  "Server is asleep (free plan idles after 15 min)"],
    [4,  "Waking the instance"],
    [8,  "Allocating compute resources"],
    [14, "Starting the container"],
    [20, "Loading environment variables"],
    [27, "Starting Node.js runtime"],
    [34, "Connecting to MongoDB Atlas"],
    [42, "Opening port and running health check"],
    [52, "Almost there, finishing startup"]
  ];

  var $ = function (id) { return document.getElementById(id); };
  var offlineView = $("offlineView"), bootView = $("bootView");
  var retryBtn = $("retry"), nowBtn = $("now"), offMsg = $("offMsg");
  var logEl = $("log"), barFill = $("barFill"), elapsedEl = $("elapsed");
  var note = $("note"), bootTitle = $("bootTitle"), bootLead = $("bootLead");
  var chipNet = $("chipNet"), chipSrv = $("chipSrv"), chipPing = $("chipPing"), pingTxt = $("pingTxt");

  var state = "checking";   // checking | offline | waking | ready
  var t0 = 0;               // when waking started (0 = never)
  var shown = 0;
  var rows = [];
  var busy = false, timer = null, finished = false;

  function mmss(sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }
  function setChip(el, cls) { el.className = "chip" + (cls ? " " + cls : ""); }

  // fetch with a hard timeout (works even without AbortController)
  function timedFetch(url, opts, ms) {
    return new Promise(function (resolve, reject) {
      var done = false;
      var ctrl = typeof AbortController === "function" ? new AbortController() : null;
      var to = setTimeout(function () {
        if (done) return; done = true;
        if (ctrl) ctrl.abort();
        reject(new Error("timeout"));
      }, ms);
      opts = opts || {};
      if (ctrl) opts.signal = ctrl.signal;
      fetch(url, opts).then(function (r) {
        if (done) return; done = true; clearTimeout(to); resolve(r);
      }, function (e) {
        if (done) return; done = true; clearTimeout(to); reject(e);
      });
    });
  }

  // Internet is up if any probe gets through
  function checkInternet() {
    return new Promise(function (resolve) {
      var left = NET_PROBES.length, ok = false;
      NET_PROBES.forEach(function (u) {
        timedFetch(u + "?t=" + Date.now(), { mode: "no-cors", cache: "no-store" }, 6000)
          .then(function () { if (!ok) { ok = true; resolve(true); } })
          .catch(function () {})
          .then(function () { left -= 1; if (left === 0 && !ok) resolve(false); });
      });
    });
  }

  // Server is ready only if /health really answers 200 with ok:true (read via CORS).
  // A sleeping Render service answers with a 503/startup page and no CORS header, so that
  // counts as "not ready" instead of being mistaken for success.
  function checkServer() {
    var started = Date.now();
    return timedFetch(SERVER + "/health?t=" + started, { mode: "cors", cache: "no-store", credentials: "omit" }, 9000)
      .then(function (res) {
        if (!res.ok) throw new Error("status " + res.status);
        return res.json();
      })
      .then(function (data) {
        if (!data || data.ok !== true) throw new Error("bad body");
        return { ok: true, ms: Date.now() - started };
      })
      .catch(function () { return { ok: false, ms: 0 }; });
  }

  function show(view) {
    offlineView.hidden = view !== "offline";
    bootView.hidden = view === "offline";
  }

  function addRow(text, sec) {
    var row = document.createElement("div");
    row.className = "row";
    row.innerHTML = '<span class="t"></span><span class="m"></span><span class="s"></span>';
    row.children[0].textContent = "[" + mmss(sec) + "]";
    row.children[1].textContent = text;
    logEl.appendChild(row);
    logEl.scrollTop = logEl.scrollHeight;
    return row;
  }
  function markDone(row) {
    if (!row) return;
    row.classList.add("done");
    row.children[2].textContent = "\u2713";
  }
  function markSpin(row) { row.children[2].innerHTML = '<span class="sp"></span>'; }

  function ensureSteps(sec) {
    var want = 0;
    for (var i = 0; i < STEPS.length; i++) if (sec >= STEPS[i][0]) want = i + 1;
    while (shown < want) {
      if (rows.length) markDone(rows[rows.length - 1]);
      var r = addRow(STEPS[shown][1], STEPS[shown][0]);
      markSpin(r);
      rows.push(r);
      shown += 1;
    }
  }

  function startWaking() {
    if (state === "waking") return;
    state = "waking";
    t0 = Date.now();
    shown = 0; rows = []; logEl.innerHTML = "";
    show("boot");
    bootTitle.textContent = "Starting the server";
    bootLead.textContent = "Sync runs on a free server that sleeps when idle. First open can take up to a minute.";
    ensureSteps(0);
    tickClock();
  }

  function tickClock() {
    if (state !== "waking") return;
    var sec = Math.floor((Date.now() - t0) / 1000);
    elapsedEl.textContent = mmss(sec);
    ensureSteps(sec);
    barFill.style.width = Math.min(95, Math.round((1 - Math.exp(-sec / 28)) * 100)) + "%";
    if (sec >= 150) note.textContent = "Still no response. Check that your internet is stable, or tap Check now.";
    else if (sec >= 75) note.textContent = "Taking longer than usual. Hang on, we keep checking automatically.";
    setTimeout(tickClock, 500);
  }

  function goReady(ms) {
    if (finished) return;
    finished = true;
    var wasWaking = t0 !== 0;
    state = "ready";
    show("boot");
    bootTitle.textContent = "Server is ready";
    bootLead.textContent = "Opening Sync...";
    setChip(chipNet, "ok"); setChip(chipSrv, "ok");
    chipPing.hidden = false; setChip(chipPing, "ok"); pingTxt.textContent = "Ping " + ms + " ms";
    note.textContent = "";
    nowBtn.hidden = true;
    barFill.style.width = "100%";

    var sec = wasWaking ? Math.floor((Date.now() - t0) / 1000) : 0;
    elapsedEl.textContent = mmss(sec);
    rows.forEach(markDone);

    // If we had been waiting, fast-forward the remaining steps to a tick each
    var delay = 0;
    if (wasWaking) {
      for (var i = shown; i < STEPS.length; i++) {
        (function (txt) {
          delay += 70;
          setTimeout(function () { markDone(addRow(txt, sec)); }, delay);
        })(STEPS[i][1]);
      }
    }
    setTimeout(function () { markDone(addRow("Server online (" + ms + " ms). Opening app", sec)); }, delay + 120);
    setTimeout(function () { window.location.replace(SERVER); }, delay + 800);
  }

  function cycle(manual) {
    if (busy || finished) return;
    busy = true;
    clearTimeout(timer);
    if (manual) { retryBtn.disabled = true; nowBtn.disabled = true; offMsg.textContent = "Checking..."; }

    checkInternet().then(function (net) {
      if (!net) {
        state = "offline"; show("offline");
        setChip(chipNet, "bad"); setChip(chipSrv, "");
        offMsg.textContent = manual ? "Still offline. We'll keep trying." : "Waiting for a connection...";
        return null;
      }
      setChip(chipNet, "ok");
      return checkServer().then(function (srv) {
        if (srv.ok) { goReady(srv.ms); return; }
        startWaking();
        setChip(chipSrv, "wait");
        chipPing.hidden = true;
      });
    }).catch(function () {}).then(function () {
      busy = false;
      retryBtn.disabled = false; nowBtn.disabled = false;
      if (!finished) {
        // offline: re-check every 3s; server waking: every 2s
        timer = setTimeout(function () { cycle(false); }, state === "offline" ? 3000 : 2000);
      }
    });
  }

  retryBtn.addEventListener("click", function () { cycle(true); });
  nowBtn.addEventListener("click", function () { cycle(true); });
  window.addEventListener("online", function () { cycle(true); });
  window.addEventListener("offline", function () {
    if (state !== "ready") { state = "offline"; show("offline"); setChip(chipNet, "bad"); }
  });
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) cycle(true);
  });

  // first check
  setChip(chipNet, "wait"); setChip(chipSrv, "wait");
  var first = addRow("Checking connection", 0);
  markSpin(first); rows.push(first);
  cycle(false);
})();
</script>
</body>
</html>
