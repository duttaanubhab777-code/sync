name: Build Android APK

# শুধু mobile/ ফোল্ডার বদলালে (বা হাতে চালালে) APK বানায়।
# সাইটের UI/ব্যাকএন্ড আপডেটে নতুন APK লাগে না, কারণ অ্যাপ লাইভ সাইট থেকেই লোড হয়।
on:
    workflow_dispatch:
    push:
        branches: [main]
        paths:
            - "mobile/**"
            - ".github/workflows/android-apk.yml"

permissions:
    contents: write

concurrency:
    group: android-apk
    cancel-in-progress: true

jobs:
    apk:
        runs-on: ubuntu-latest
        timeout-minutes: 40
        defaults:
            run:
                working-directory: mobile
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # আগের build থেকে কী বদলেছে (release description) বের করতে পুরো history লাগে

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 21

            - name: Install Capacitor
              run: npm install --no-audit --no-fund

            - name: Install ImageMagick (icon & splash)
              run: sudo apt-get update -y && sudo apt-get install -y imagemagick

            # অ্যাপ নিজের build নম্বর জানে User-Agent থেকে ("SyncApp/1.0.<build>"), তাই নতুন ভার্সন আছে কিনা মিলিয়ে দেখতে পারে
            - name: Stamp build number into the app
              env:
                  VERSION_CODE: ${{ github.run_number }}
              run: |
                  node -e "const fs=require('fs');const f='capacitor.config.json';const c=JSON.parse(fs.readFileSync(f,'utf8'));c.android.appendUserAgent='SyncApp/1.0.'+process.env.VERSION_CODE;fs.writeFileSync(f,JSON.stringify(c,null,4)+'\n');console.log(c.android.appendUserAgent)"

            - name: Create Android project
              run: npx cap add android

            - name: Customise (permissions, icon, splash, version)
              env:
                  VERSION_CODE: ${{ github.run_number }}
              run: bash scripts/customize-android.sh

            # প্রতিবার একই signing key ব্যবহার হয়, তাই নতুন APK পুরনো অ্যাপের ওপর আপডেট হিসেবে বসে
            - name: Use fixed signing key
              run: |
                  mkdir -p ~/.android
                  cp debug.keystore ~/.android/debug.keystore

            # Maven Central / Google repo থেকে কিছু POM "Could not find" (404) আসছিল, ফলে build ১২ সেকেন্ডেই ফেল করত।
            # তাই Google-এর Maven Central mirror fallback হিসেবে যোগ করা হলো, আর ব্যর্থ হলে ৩ বার পর্যন্ত আবার চেষ্টা হয়।
            - name: Add Maven mirror fallback for Gradle
              run: |
                  mkdir -p ~/.gradle/init.d
                  cat > ~/.gradle/init.d/mirror.gradle <<'EOF_GRADLE'
                  def mirror = 'https://maven-central.storage-download.googleapis.com/maven2/'
                  beforeSettings { settings ->
                      settings.pluginManagement.repositories.maven { url mirror }
                  }
                  allprojects {
                      buildscript.repositories.maven { url mirror }
                      repositories.maven { url mirror }
                  }
                  EOF_GRADLE

            - name: Build APK
              working-directory: mobile/android
              run: |
                  chmod +x gradlew
                  for attempt in 1 2 3; do
                      echo "::group::Gradle attempt $attempt"
                      if ./gradlew assembleDebug --no-daemon --stacktrace --refresh-dependencies; then
                          echo "::endgroup::"; exit 0
                      fi
                      echo "::endgroup::"
                      echo "Attempt $attempt failed" >&2
                      sleep 20
                  done
                  exit 1

            # APK সত্যিই fixed key দিয়ে sign হলো কিনা আর versionCode ঠিক বসল কিনা লগে দেখায়।
            # প্রতি build-এ SHA-256 একই না থাকলে ফোনে আপডেট না বসে "package conflicts" আসবে।
            # (এই লগের fingerprint = debug.keystore-এর fingerprint হওয়া উচিত)
            - name: Verify APK signature and version
              run: |
                  BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
                  APK=android/app/build/outputs/apk/debug/app-debug.apk
                  "$BT/apksigner" verify --print-certs "$APK" | grep -E "SHA-256|SHA-1"
                  "$BT/aapt" dump badging "$APK" | grep -E "^package:"
                  EXPECT="$(keytool -list -v -keystore debug.keystore -storepass android 2>/dev/null | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')"
                  GOT="$("$BT/apksigner" verify --print-certs "$APK" | grep -m1 'SHA-256 digest' | sed 's/.*: *//' | tr -d ' ' | tr 'A-F' 'a-f')"
                  echo "expected=$EXPECT"
                  echo "actual  =$GOT"
                  [ "$EXPECT" = "$GOT" ] || { echo "APK is NOT signed with debug.keystore" >&2; exit 1; }

            - name: Prepare file
              run: cp android/app/build/outputs/apk/debug/app-debug.apk Sync.apk

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: Sync-apk
                  path: mobile/Sync.apk
                  retention-days: 30

            # Release description: আগের build-এর পর থেকে যে commit গুলো এসেছে সেগুলো লিস্ট করে
            - name: Build release notes
              working-directory: ${{ github.workspace }}
              env:
                  RUN_NUMBER: ${{ github.run_number }}
              run: |
                  PREV_TAG="$(git tag --list 'android-v*' --sort=-v:refname | head -n 1)"
                  [ -n "$PREV_TAG" ] || PREV_TAG="android-latest"
                  PREV="$(git rev-parse -q --verify "refs/tags/${PREV_TAG}^{commit}" || true)"
                  if [ -n "$PREV" ] && git merge-base --is-ancestor "$PREV" HEAD && [ "$PREV" != "$(git rev-parse HEAD)" ]; then
                      LOG="$(git log --no-merges --pretty='- %s (`%h`)' -n 15 "$PREV..HEAD")"
                  else
                      LOG="$(git log --no-merges --pretty='- %s (`%h`)' -n 10)"
                  fi
                  [ -n "$LOG" ] || LOG="- Rebuilt from the latest code"
                  {
                      echo "## Sync Android v1.0.${RUN_NUMBER}"
                      echo
                      echo "Build #${RUN_NUMBER} · $(date -u '+%d %b %Y, %H:%M') UTC · commit \`$(git rev-parse --short HEAD)\`"
                      echo
                      echo "### What's new"
                      echo "$LOG"
                      echo
                      echo "### Install"
                      echo "1. Download **Sync.apk** from the assets below."
                      echo "2. Open it and allow installs from this source if Android asks."
                      echo "3. It installs over the old version, so no uninstall is needed."
                  } > RELEASE_NOTES.md
                  cat RELEASE_NOTES.md

            # আগে একটাই "android-latest" release ছিল। এখন প্রতি build-এর নিজস্ব release থাকে (অ্যাপের Version history এর জন্য),
            # তাই পুরনো android-latest একবার মুছে ফেলা হয়। না থাকলে কিছু হয় না।
            - name: Retire the old android-latest release
              working-directory: ${{ github.workspace }}
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release delete android-latest --cleanup-tag --yes || true

            - name: Publish to Releases
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: android-v1.0.${{ github.run_number }}
                  target_commitish: ${{ github.sha }}
                  name: Sync Android v1.0.${{ github.run_number }}
                  body_path: RELEASE_NOTES.md
                  files: mobile/Sync.apk
                  make_latest: true

            # নতুন APK release হলে Android অ্যাপের ব্যবহারকারীদের "Update Now" বাটনসহ নোটিফিকেশন পাঠাতে সার্ভারকে জানায়।
            # GitHub repo → Settings → Secrets-এ APP_UPDATE_NOTIFY_SECRET দিলে এটা কাজ করে (সার্ভারের .env-এর মানের সাথে এক)।
            # না দিলে বাদ যায়; তখনও সার্ভার নিজে প্রতি ৫ মিনিটে নতুন release খুঁজে নোটিফিকেশন পাঠায়।
            - name: Notify Android users about the update
              continue-on-error: true
              env:
                  SYNC_API_URL: ${{ secrets.SYNC_API_URL }}
                  APP_UPDATE_NOTIFY_SECRET: ${{ secrets.APP_UPDATE_NOTIFY_SECRET }}
              run: |
                  if [ -z "$APP_UPDATE_NOTIFY_SECRET" ]; then
                      echo "APP_UPDATE_NOTIFY_SECRET নেই, তাই এই ধাপ বাদ (সার্ভার নিজেই খুঁজে নেবে)"
                      exit 0
                  fi
                  API="${SYNC_API_URL:-https://sync-5lfm.onrender.com}"
                  sleep 20
                  curl -sS --fail-with-body --max-time 100 --retry 3 --retry-delay 15 --retry-all-errors \
                      -X POST "${API%/}/api/v1/app/updates/notify" \
                      -H "x-update-secret: $APP_UPDATE_NOTIFY_SECRET"
                  echo
