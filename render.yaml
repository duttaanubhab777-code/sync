services:
  - type: web
    name: sync
    runtime: node
    plan: free
    region: singapore
    # Root directory ফাঁকা (repo root), কারণ একটাই Web Service থেকে frontend/dist ও node-backend একসাথে চলবে
    buildCommand: npm --prefix frontend install --include=dev && npm --prefix frontend run build && npm --prefix node-backend install
    startCommand: npm --prefix node-backend start
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - node-backend/**
        - frontend/**
        - assets/**
        - package.json
        - render.yaml
      ignoredPaths:
        - python-service/**
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRY
        value: 30d
      - key: ALLOW_INLINE_SCRIPTS
        value: "false"
      # Set the sync:false values in the Render Dashboard Environment tab.
      # JWT_SECRET must exactly match python-service/config.py on PythonAnywhere.
      # CLOUDINARY_API_KEY / CLOUDINARY_API_SECRET here are used only to delete files from Cloudinary
      # when they are deleted in the app. Never put them in the frontend.
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: PYTHON_SERVICE_URL
        sync: false
      # Signup OTP mail: must exactly match MAIL_RELAY_SECRET in python-service/config.py (24+ chars)
      - key: MAIL_RELAY_SECRET
        sync: false
      # একাধিক Super Admin দিতে চাইলে কমা দিয়ে আলাদা করে দাও: a@gmail.com,b@gmail.com
      - key: SUPER_ADMIN_EMAILS
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false
      # Generate with: npx web-push generate-vapid-keys
      - key: VAPID_PUBLIC_KEY
        value: "BHoaUyonUbZRSgwO6ya24hyqwK2Wy0AFlsn8jqfAUETxHTgX4OV3YZpQyYI1kPTq_kvasCpROCkn4eaU8cxHAe0"
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:sync93346@gmail.com
      # Android App Push Notifications (Firebase Service Account)
      # ডাউনলোড করা Firebase private key JSON ফাইলটা পুরোটা FIREBASE_SERVICE_ACCOUNT_JSON-এ পেস্ট করো
      # অথবা নিচের FIREBASE_CLIENT_EMAIL ও FIREBASE_PRIVATE_KEY আলাদাভাবে দাও
      - key: FIREBASE_PROJECT_ID
        value: "sync-34886"
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      # প্রতিটা commit মেসেজ অটো অ্যানাউন্সমেন্ট (GitHub secret COMMIT_ANNOUNCE_SECRET-এর সাথে এক মান)
      - key: COMMIT_ANNOUNCE_SECRET
        sync: false
