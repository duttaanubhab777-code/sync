services:
  - type: web
    name: sync
    runtime: node
    plan: free
    region: singapore
    # Root directory ফাঁকা (repo root), কারণ একটাই Web Service থেকে frontend/dist ও node-backend একসাথে চলবে
    buildCommand: npm --prefix frontend install --include=dev && npm --prefix frontend run build && npm --prefix node-backend install
    startCommand: npm --prefix node-backend start
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - node-backend/**
        - frontend/**
        - package.json
        - render.yaml
      ignoredPaths:
        - python-service/**
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRY
        value: 30d
      - key: ALLOW_INLINE_SCRIPTS
        value: "false"
      # Set the sync:false values in the Render Dashboard Environment tab.
      # JWT_SECRET must exactly match python-service/config.py on PythonAnywhere.
      # Cloudinary API credentials (API_KEY and API_SECRET) belong ONLY on PythonAnywhere,
      # never in this Render service or the frontend. Only CLOUDINARY_CLOUD_NAME is needed here.
      # (SERVICE_KEY এখন কোথাও ব্যবহার হয় না, তাই সরানো হয়েছে; ভবিষ্যতে /scan যোগ হলে আবার লাগবে)
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: PYTHON_SERVICE_URL
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false
      # Generate with: npx web-push generate-vapid-keys
      - key: VAPID_PUBLIC_KEY
        value: "BHoaUyonUbZRSgwO6ya24hyqwK2Wy0AFlsn8jqfAUETxHTgX4OV3YZpQyYI1kPTq_kvasCpROCkn4eaU8cxHAe0"
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
